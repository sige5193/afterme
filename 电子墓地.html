<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>电子墓地</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;600;900&family=ZCOOL+QingKe+HuangYou&display=swap" rel="stylesheet">
<style>
:root{
  /* 夜里的墓园：墨蓝夜色、纸钱黄、朱砂印、鬼火青。布局：顶栏 + 一整片墓园地图；抽屉看碑，全屏层办丧事、化纸、托梦。白天换成阴天的灰绿。 */
  --ink:#0b0e13; --ink-2:#151b23; --stone:#2b323b; --bone:#ece6d6; --bone-dim:#a6a192;
  --joss:#d9b25a; --seal:#b8342a; --wisp:#9fe8d4; --line:rgba(236,230,214,.14);
  --font-brush:"Ma Shan Zheng","STXingkai","Xingkai SC","KaiTi","Kaiti SC",serif;
  --font-body:"Noto Serif SC","Songti SC","STSong","SimSun",serif;
  --font-cyber:"ZCOOL QingKe HuangYou","PingFang SC","Microsoft YaHei",sans-serif;
  color-scheme:dark;
}
body.day{
  --ink:#c9cdc5; --ink-2:#d8dbd4; --stone:#8b9188; --bone:#1d2226; --bone-dim:#545b55;
  --joss:#8a6514; --wisp:#2f6b5e; --line:rgba(29,34,38,.18);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--ink);color:var(--bone);font-family:var(--font-body);font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased;transition:background .8s,color .8s}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--joss);outline-offset:2px}
h1,h2,h3{text-wrap:balance;margin:0}
.brush{font-family:var(--font-brush);font-weight:400}
.vt{writing-mode:vertical-rl;text-orientation:upright}
[hidden]{display:none!important}

/* ---------- 顶栏 ---------- */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap;padding:10px 16px;background:color-mix(in srgb,var(--ink) 88%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.brand{font-family:var(--font-brush);font-size:30px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.brand small{font-family:var(--font-body);font-size:11px;color:var(--bone-dim);letter-spacing:.24em;margin-left:8px;vertical-align:middle}
.clock{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--bone-dim);padding:3px 11px;border:1px solid var(--line);border-radius:999px;font-variant-numeric:tabular-nums;white-space:nowrap}
.clock b{color:var(--joss);font-weight:600}
.who{font-size:13px;color:var(--bone-dim);white-space:nowrap}
.who b{color:var(--bone);font-weight:600}
.spacer{flex:1}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:7px 14px;border-radius:6px;border:1px solid var(--line);background:transparent;font-size:14px;line-height:1.4;transition:background .2s,border-color .2s,filter .2s;white-space:nowrap}
.btn:hover{border-color:var(--joss)}
.btn.primary{background:var(--joss);border-color:var(--joss);color:#17120a;font-weight:600}
body.day .btn.primary{color:#fbf6ea}
.btn.primary:hover{filter:brightness(1.08)}
.btn.seal{background:var(--seal);border-color:var(--seal);color:#fff;font-weight:600}
.btn.sm{padding:4px 10px;font-size:13px}
.btn.quiet{border-color:transparent;color:var(--bone-dim)}
.btn.quiet:hover{color:var(--bone)}
.btn:disabled{opacity:.42;cursor:not-allowed;filter:none}
.badge{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--seal);color:#fff;font-size:11px;font-weight:700;line-height:1;font-family:system-ui,sans-serif}
.net{font-size:12px;color:var(--bone-dim)}

/* ---------- 墓园 ---------- */
main{min-height:calc(100% - 58px)}
.scene{position:relative;min-height:calc(100vh - 58px);overflow:hidden}
#bg{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}
.yard{position:relative;max-width:1000px;margin:0 auto;padding:28px 16px 70px}
.hero{max-width:640px;padding:30px 0 34px}
.hero h1{font-family:var(--font-brush);font-size:clamp(56px,11vw,104px);line-height:1;letter-spacing:.06em;font-weight:400}
.hero h1 span{color:var(--joss)}
.hero p{max-width:32em;margin:16px 0 22px;color:var(--bone-dim);font-size:16px}
.hero p b{color:var(--bone);font-weight:600}
.hero .row{display:flex;gap:10px;flex-wrap:wrap}
.hero .btn{padding:10px 18px;font-size:15px}
.ghostbar{display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;margin:8px 0 26px;padding:12px 16px;border:1px solid var(--line);border-radius:10px;background:color-mix(in srgb,var(--ink) 70%,transparent)}
.ghostbar .gb-t{font-family:var(--font-brush);font-size:26px;line-height:1;color:var(--wisp)}
.ghostbar .gb-d{font-size:13px;color:var(--bone-dim);flex:1;min-width:200px}
.ghostbar .zs{font-size:13px;color:#fff;background:var(--seal);padding:3px 10px;border-radius:999px;font-variant-numeric:tabular-nums}
.yard-meta{display:flex;gap:6px 18px;flex-wrap:wrap;font-size:12px;color:var(--bone-dim);margin:0 0 14px;letter-spacing:.04em}
.yard-meta b{color:var(--bone);font-weight:600}
.localnote{font-size:12px;color:var(--bone);background:color-mix(in srgb,var(--seal) 30%,transparent);border:1px solid color-mix(in srgb,var(--seal) 60%,transparent);border-radius:8px;padding:8px 12px;margin-bottom:16px}
.grid{position:relative;display:grid;grid-template-columns:repeat(6,1fr);gap:18px 10px}
@media (max-width:820px){.grid{grid-template-columns:repeat(4,1fr)}}
@media (max-width:540px){.grid{grid-template-columns:repeat(3,1fr)}}
.plot{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:2px;height:156px;padding:8px 4px 6px;border:0;background:transparent;border-radius:10px;transition:background .2s}
.plot:hover{background:color-mix(in srgb,var(--bone) 6%,transparent)}
.plot .mound{position:absolute;bottom:44px;left:50%;transform:translateX(-50%);width:92px;height:26px;border-radius:50%;background:radial-gradient(ellipse at 50% 40%,rgba(120,98,66,.6),rgba(60,48,30,0) 70%)}
body.day .plot .mound{background:radial-gradient(ellipse at 50% 40%,rgba(98,84,60,.45),rgba(60,48,30,0) 70%)}
.plot .pname{position:relative;font-size:13px;font-weight:600;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:8px}
.plot .psub{position:relative;font-size:11px;color:var(--bone-dim);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plot.empty .hole{position:relative;width:62px;height:76px;border:1px dashed color-mix(in srgb,var(--bone) 22%,transparent);border-radius:30px 30px 4px 4px;margin-bottom:6px}
.plot.empty .plabel{position:relative;font-size:11px;color:var(--bone-dim)}
.plot.empty .plabel.sp{color:var(--joss)}
.plot.mine .pname{color:var(--joss)}
.plot.mine::before{content:"我的坟";position:absolute;top:6px;right:6px;font-size:10px;line-height:1;padding:3px 4px;border:1px solid var(--seal);color:var(--seal);border-radius:3px;transform:rotate(6deg)}
.plot.wobble .stone{animation:wobble .5s}

/* 碑：小号 */
.stone{position:relative;display:grid;place-items:center;width:56px;height:78px;border-radius:28px 28px 4px 4px;background:linear-gradient(160deg,#68717b,#3a414a 75%);color:#e9e4d7;box-shadow:inset 0 2px 0 rgba(255,255,255,.14),0 5px 0 #23282e;font-size:12px;letter-spacing:.12em;font-weight:600;text-shadow:0 -1px 0 rgba(0,0,0,.5)}
.stone .vt{max-height:62px;overflow:hidden}
.stone.s-hanbai{background:linear-gradient(160deg,#f7f3ea,#cfc7b6 80%);color:#8a6514;text-shadow:0 1px 0 #fff;box-shadow:inset 0 2px 0 #fff,0 5px 0 #a39b8a}
.stone.s-neon{background:#0b0d12;border:2px solid #4ef0ff;border-radius:6px;color:#a8f8ff;font-family:var(--font-cyber);font-weight:400;box-shadow:0 0 14px rgba(78,240,255,.55),inset 0 0 10px rgba(78,240,255,.3);text-shadow:0 0 6px #4ef0ff}
.stone.s-mupai{width:30px;height:88px;border-radius:3px;background:linear-gradient(90deg,#6e4c2c,#9a7047 50%,#6e4c2c);color:#2a1a0c;text-shadow:0 1px 0 rgba(255,230,190,.3);box-shadow:0 4px 0 #3f2a16}
.stone.s-tubao{width:84px;height:44px;margin-top:34px;border-radius:50% 50% 10px 10px / 100% 100% 10px 10px;background:radial-gradient(ellipse at 50% 30%,#7a5d3b,#4a3721 75%);box-shadow:0 4px 0 #2e2214}
.stone.s-tubao .stake{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);width:24px;height:60px;display:grid;place-items:center;background:linear-gradient(90deg,#7c5733,#a87c4f,#7c5733);color:#2a1a0c;border-radius:2px;font-size:11px;text-shadow:none}
.stone.s-tubao .stake .vt{max-height:52px}
.plot.hot .stone::after{content:"";position:absolute;left:50%;bottom:100%;width:10px;height:34px;margin-left:-5px;border-radius:50%;background:radial-gradient(closest-side,rgba(225,222,210,.55),transparent);filter:blur(3px);animation:smoke 3.4s ease-in-out infinite}

/* 鬼 */
.ghost{position:absolute;left:0;top:0;width:44px;height:54px;margin-left:-22px;pointer-events:none;z-index:6;color:#f5f2ea;transition:transform .9s cubic-bezier(.4,.1,.2,1)}
.ghost svg{width:100%;height:100%;animation:bob 2.6s ease-in-out infinite;filter:drop-shadow(0 0 10px rgba(159,232,212,.6))}
body.day .ghost svg{filter:drop-shadow(0 0 6px rgba(255,120,80,.7))}
.ghost .tag{position:absolute;top:-17px;left:50%;transform:translateX(-50%);font-size:11px;line-height:1;white-space:nowrap;color:var(--wisp);font-weight:600}
.ghost.peer{color:var(--wisp);opacity:.8;width:36px;height:44px;margin-left:-4px}
.ghost.noanim{transition:none}

/* ---------- 抽屉：看碑 ---------- */
.drawer{position:fixed;top:var(--toph,58px);right:0;bottom:0;width:min(420px,100%);z-index:40;background:var(--ink-2);border-left:1px solid var(--line);transform:translateX(105%);transition:transform .35s ease;overflow-y:auto;box-shadow:-20px 0 60px rgba(0,0,0,.35);padding:16px 20px 28px}
.drawer.open{transform:none}
@media (max-width:640px){.drawer{top:auto;width:100%;height:88%;border-left:0;border-top:1px solid var(--line);border-radius:16px 16px 0 0;transform:translateY(105%)}}
.dr-head{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--bone-dim);letter-spacing:.06em}
.x{border:0;background:transparent;font-size:18px;padding:4px 8px;color:var(--bone-dim)}
.x:hover{color:var(--bone)}
.facts{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:22px 0 0;font-size:14px}
.facts dt{color:var(--bone-dim)}
.facts dd{margin:0}
.block{margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}
.lbl{font-size:12px;color:var(--bone-dim);letter-spacing:.12em;margin-bottom:6px}
.ep-text{font-size:19px;line-height:1.7;margin:0;font-weight:600}
.note{font-size:12px;color:var(--bone-dim);margin-top:6px}
.offer-chips{display:flex;flex-wrap:wrap;gap:6px}
.oc{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;border:1px solid var(--line);font-size:13px;font-variant-numeric:tabular-nums}
.marks{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.mark{font-size:12px;padding:2px 8px;border:1px solid var(--seal);color:var(--seal);border-radius:3px}
body:not(.day) .mark{color:#e46a5e;border-color:#e46a5e}
.dr-acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.dr-acts .btn.primary{flex:1 1 100%;padding:11px;font-size:16px}
.why{font-size:12px;color:var(--bone-dim);margin-top:8px}

/* 碑：大号 */
.bigstone{position:relative;margin:18px auto 0;width:220px;height:300px;border-radius:110px 110px 10px 10px;display:flex;flex-direction:column;align-items:center;gap:12px;padding:22px 16px 18px;background:linear-gradient(160deg,#6c757f,#3a414a 72%);color:#ebe6da;box-shadow:inset 0 3px 0 rgba(255,255,255,.14),0 12px 0 #23282e;text-shadow:0 1px 0 rgba(255,255,255,.12),0 -1px 0 rgba(0,0,0,.55)}
.bigstone.shake{animation:shake .45s}
.bs-cols{display:flex;flex-direction:row-reverse;justify-content:center;align-items:flex-start;gap:14px;flex:1;min-height:0}
.bs-main{font-size:28px;font-weight:900;letter-spacing:.12em;line-height:1.1;white-space:nowrap;max-height:200px;overflow:hidden}
.bs-side{font-size:11px;letter-spacing:.08em;line-height:1.3;opacity:.82;margin-top:14px;max-height:180px}
.bigstone.s-hanbai{background:linear-gradient(160deg,#f8f4eb,#cbc3b1 82%);color:#8a6514;text-shadow:0 1px 0 #fff;box-shadow:inset 0 3px 0 #fff,0 12px 0 #9f978a}
.bigstone.s-neon{background:#090b10;border:2px solid #4ef0ff;border-radius:12px;color:#aaf8ff;font-family:var(--font-cyber);text-shadow:0 0 8px #4ef0ff;box-shadow:0 0 30px rgba(78,240,255,.45),inset 0 0 24px rgba(78,240,255,.25)}
.bigstone.s-neon .bs-main{font-weight:400}
.bigstone.s-mupai,.bigstone.s-tubao{width:150px;border-radius:6px;background:linear-gradient(90deg,#6e4c2c,#a1774c 50%,#6e4c2c);color:#26170a;text-shadow:0 1px 0 rgba(255,230,190,.35);box-shadow:0 10px 0 #3f2a16}
.bigstone.s-tubao{margin-bottom:40px}
.bigstone.s-tubao::after{content:"";position:absolute;left:50%;bottom:-46px;width:260px;height:70px;transform:translateX(-50%);border-radius:50% 50% 12px 12px / 100% 100% 12px 12px;background:radial-gradient(ellipse at 50% 30%,#7a5d3b,#4a3721 75%);z-index:-1}

/* 遗像 */
.portrait{position:relative;display:inline-grid;place-items:center;width:46px;height:58px;background:#d8d5ce;border:4px solid #121212;border-radius:3px;flex:none;overflow:hidden;box-shadow:0 2px 6px rgba(0,0,0,.4)}
.portrait .face{font-size:28px;line-height:1;filter:grayscale(1) contrast(1.15) brightness(1.05)}
.portrait::before,.portrait::after{content:"";position:absolute;top:0;width:16px;height:16px;background:#121212}
.portrait::before{left:0;clip-path:polygon(0 0,100% 0,0 100%)}
.portrait::after{right:0;clip-path:polygon(0 0,100% 0,100% 100%)}
.portrait.big{width:150px;height:190px;border-width:9px}
.portrait.big .face{font-size:96px}
.portrait.big::before,.portrait.big::after{width:46px;height:46px}
.rosette{position:absolute;top:-30px;left:50%;width:56px;height:40px;transform:translateX(-50%);background:radial-gradient(circle at 50% 50%,#000 0 9px,transparent 10px),radial-gradient(ellipse at 22% 50%,#111 0 15px,transparent 16px),radial-gradient(ellipse at 78% 50%,#111 0 15px,transparent 16px);z-index:2}

/* ---------- 弹窗 ---------- */
.modal-back{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.6);display:grid;place-items:center;padding:16px;animation:fade .2s}
.modal{position:relative;width:min(580px,100%);max-height:calc(100% - 16px);overflow:auto;background:var(--ink-2);color:var(--bone);border:1px solid var(--line);border-radius:12px;padding:22px 22px 20px;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.modal h2{font-family:var(--font-brush);font-weight:400;font-size:32px;line-height:1.1;margin-bottom:4px}
.modal .sub{font-size:13px;color:var(--bone-dim);margin:0 0 16px}
.modal .x{position:absolute;top:10px;right:10px}
.mfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:6px;margin-top:14px}
.field>label,.field>.flabel{font-size:13px;color:var(--bone-dim)}
input[type=text],input[type=number],textarea{font:inherit;color:var(--bone);background:color-mix(in srgb,var(--bone) 6%,transparent);border:1px solid var(--line);border-radius:6px;padding:9px 11px;width:100%}
textarea{resize:vertical;min-height:76px;line-height:1.6}
input::placeholder,textarea::placeholder{color:var(--bone-dim);opacity:.8}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:4px 11px;border-radius:999px;border:1px solid var(--line);background:transparent;font-size:13px;line-height:1.5}
.chip:hover{border-color:var(--joss)}
.chip.on{background:var(--bone);color:var(--ink);border-color:var(--bone)}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px}
.iw{position:relative}
.item{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;gap:1px;padding:10px 6px 8px;border:1px solid var(--line);border-radius:8px;background:transparent;text-align:center}
.item:hover{border-color:var(--joss)}
.item.on{border-color:var(--joss);background:color-mix(in srgb,var(--joss) 14%,transparent)}
.item .ic{font-size:30px;line-height:1.15}
.item .nm{font-size:13px;font-weight:600}
.item .nt{font-size:11px;color:var(--bone-dim);line-height:1.35}
.iw .cnt{position:absolute;top:5px;right:5px;pointer-events:none}
.iw .minus{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;border:1px solid var(--line);background:var(--ink-2);font-size:14px;line-height:1;padding:0;display:grid;place-items:center}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.bl{border:1px solid var(--line);border-radius:10px;padding:11px 13px}
.bl-h{display:flex;justify-content:space-between;gap:8px;font-size:13px}
.bl-h time{color:var(--bone-dim);font-variant-numeric:tabular-nums;white-space:nowrap}
.bl-items{font-size:13px;color:var(--bone-dim);margin-top:2px}
.bl-msg{margin:8px 0 0;font-size:15px;line-height:1.6;cursor:default}
.bl-msg.muffled{filter:blur(3.5px);cursor:pointer;user-select:none}
.bl-f{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:8px;font-size:12px;color:var(--bone-dim)}
.ok{color:var(--wisp)}
.empty-note{font-size:14px;color:var(--bone-dim);padding:18px 0;text-align:center}
.reply-quote{margin-top:8px;padding:8px 10px;border-left:2px solid var(--wisp);font-size:13px;color:var(--bone-dim)}
.copybox{font-size:14px;padding:12px;border:1px dashed var(--line);border-radius:8px;line-height:1.7;user-select:all}
.steps-list{margin:0;padding-left:20px;font-size:14px;line-height:1.9}
.wealth{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.wealth div{border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px;display:flex;justify-content:space-between;gap:6px;font-variant-numeric:tabular-nums}
.bignum{font-family:var(--font-brush);font-size:44px;line-height:1.1;color:var(--joss)}

/* ---------- toast ---------- */
.toasts{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:100;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:min(520px,calc(100% - 32px))}
.toast{pointer-events:auto;background:#1b2129;color:#ece6d6;border:1px solid rgba(236,230,214,.16);border-left:3px solid #d9b25a;padding:10px 14px;border-radius:8px;font-size:14px;box-shadow:0 12px 30px rgba(0,0,0,.4);display:flex;gap:12px;align-items:center;animation:tin .3s}
.toast .btn{color:#ece6d6;border-color:rgba(236,230,214,.25);padding:3px 10px;font-size:13px}
.toast.err{border-left-color:#e05a4c}

/* ---------- 葬礼 ---------- */
.fun{position:fixed;inset:0;z-index:70;overflow-y:auto;background:#07090c;color:#ece6d6;--ink:#0b0e13;--ink-2:#151b23;--bone:#ece6d6;--bone-dim:#a6a192;--joss:#d9b25a;--line:rgba(236,230,214,.14);--wisp:#9fe8d4;color-scheme:dark;animation:fade .4s}
.fun-top{position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:14px;padding:12px 16px;background:rgba(7,9,12,.92);border-bottom:1px solid rgba(236,230,214,.1)}
.fun-top .x{margin-left:auto}
.steps{display:flex;gap:4px;flex-wrap:wrap;font-size:13px}
.steps span{padding:3px 10px;border-radius:999px;color:#7d796d}
.steps span.on{color:#17120a;background:#d9b25a;font-weight:600}
.steps span.done{color:#d9b25a}
.fun-body{max-width:900px;margin:0 auto;padding:28px 16px 60px}

function makeDbStore(db) {
  const tombsCol = db.collection('tombs');
  const burnsCol = db.collection('burns');
  const list = snap => snap.docs.map(d => ({id: d.id, ...d.data()}));
  return {
    watchTombs: (cb, err) => tombsCol.onSnapshot(s => cb(list(s), s.metadata), err),
    watchBurns: (cb, err) => burnsCol.orderBy('at', 'desc').limit(800).onSnapshot(s => cb(list(s), s.metadata), err),
    setTomb: (id, data) => db.doc('tombs/' + id).set(data),
    updateTomb: (id, patch) => db.doc('tombs/' + id).update(patch),
    addBurn: data => burnsCol.add(data),
    updateBurn: (id, patch) => db.doc('burns/' + id).update(patch),
  };
}
function makeLocalStore() {
  const data = LS.get('localdb', {tombs: {}, burns: {}});
  const subs = {t: new Set(), b: new Set()};
  const meta = {fromCache: false, hasPendingWrites: false};
  const emit = () => {
    const tombs = Object.entries(data.tombs).map(([id, d]) => ({id, ...d}));
    const burns = Object.entries(data.burns).map(([id, d]) => ({id, ...d})).sort((a, b) => b.at - a.at);
    subs.t.forEach(f => f(tombs, meta)); subs.b.forEach(f => f(burns, meta));
  };
  const save = () => { LS.set('localdb', data); setTimeout(emit, 0); };
  return {
    watchTombs(cb) { subs.t.add(cb); setTimeout(emit, 0); return () => subs.t.delete(cb); },
    watchBurns(cb) { subs.b.add(cb); setTimeout(emit, 0); return () => subs.b.delete(cb); },
    async setTomb(id, d) { data.tombs[id] = JSON.parse(JSON.stringify(d)); save(); },
    async updateTomb(id, p) { Object.assign(data.tombs[id], p); save(); },
    async addBurn(d) { data.burns['b' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6)] = d; save(); },
    async updateBurn(id, p) { Object.assign(data.burns[id], p); save(); },
  };
}

const Sound = (() => {
  let ctx = null, master = null, verb = null;

    o.connect(g); g.connect(master); if (wet) g.connect(verb);

  function noise(t0, dur, {freq = 300, q = 1, gain = .3} = {}) {
    const c = ac(); if (!c) return;
    const len = Math.floor(c.sampleRate * dur), buf = c.createBuffer(1, len, c.sampleRate), ch = buf.getChannelData(0);
    for (let i = 0; i < len; i++) ch[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2);
    const s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    s.buffer = buf; f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = q; g.gain.value = gain;
    s.connect(f); f.connect(g); g.connect(master); s.start(t0);

    knock() { const c = ac(); if (!c) return; const t = c.currentTime; [0, .2, .4].forEach(d => { tone(110, t + d, .18, {gain: .5, wet: false, slide: 70}); noise(t + d, .08, {freq: 260, q: 2, gain: .5}); }); },

    whoosh() { const c = ac(); if (!c) return; noise(c.currentTime, 1.2, {freq: 500, q: .5, gain: .25}); },
    dirge() {
      this.stop(); const c = ac(); if (!c) return;
      // 自写的五声小调慢板
      const A3 = 220, mel = [[A3, 1.2], [261.6, .8], [293.7, 1.2], [329.6, 1.6], [293.7, .8], [261.6, .8], [A3, 1.6], [196, 1.2], [220, 2.4], [261.6, 1.2], [329.6, .8], [392, 1.2], [329.6, 1.6], [293.7, .8], [261.6, 1.2], [A3, 2.8]];

const BG = (() => {
  let cv, ctx, w = 0, h = 0, lastSig = '', horizon = 260, stars = [], wisps = [], fogs = [], hills = [], trees = [], raf = 0, lastT = 0;
  function init(c) {
    cv = c; ctx = cv.getContext('2d');
    new ResizeObserver(relayout).observe(cv.parentElement);
    relayout();
    document.addEventListener('visibilitychange', () => { if (!document.hidden) kick(); });
  }
  function relayout() {
    if (!cv) return;
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    w = cv.parentElement.clientWidth; h = cv.parentElement.clientHeight;
    cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const g = $('#grid');
    const hz = g ? clamp(g.getBoundingClientRect().top - cv.getBoundingClientRect().top - 16, 120, h - 60) : 260;
    const sig = `${w}|${h}|${Math.round(hz)}`;
    if (sig === lastSig) { kick(); return; }
    lastSig = sig; horizon = hz;
    stars = Array.from({length: Math.round(w / 9)}, () => ({x: Math.random() * w, y: Math.random() * (horizon - 30), r: Math.random() * 1.2 + .2, p: Math.random() * 6}));
    wisps = Array.from({length: Math.max(6, Math.round(w / 130))}, () => newWisp(true));
    fogs = Array.from({length: 5}, (_, i) => ({x: Math.random() * w, y: horizon + 30 + i * (h - horizon) / 5, rx: 260 + Math.random() * 260, ry: 26 + Math.random() * 24, v: .08 + Math.random() * .16}));
    hills = []; for (let x = 0; x <= w + 40; x += 40) hills.push(horizon - 14 - Math.sin(x / 170) * 12 - Math.sin(x / 61) * 5);
    trees = []; for (let x = 10; x < w; x += 50 + Math.random() * 120) if (x < w * .3 || x > w * .7 || Math.random() < .3) trees.push({x, hgt: 40 + Math.random() * 46, wd: 9 + Math.random() * 8});
    kick();
  }
  function newWisp(any) { return {x: Math.random() * w, y: any ? horizon + Math.random() * (h - horizon) : h + 20, vy: -(.15 + Math.random() * .35), vx: (Math.random() - .5) * .3, r: 5 + Math.random() * 7, p: Math.random() * 6, life: 0}; }
  function kick() { cancelAnimationFrame(raf); if (REDUCED) draw(0); else raf = requestAnimationFrame(loop); }
  function loop(t) {
    if (document.hidden || !cv.isConnected || $('#scene').hidden) { raf = 0; return; }
    if (t - lastT > 33) { draw(t); lastT = t; }
    raf = requestAnimationFrame(loop);
  }
  function draw(t) {
    const night = !document.body.classList.contains('day');
    ctx.clearRect(0, 0, w, h);

    if (night) { g.addColorStop(0, '#060912'); g.addColorStop(1, '#162032'); } else { g.addColorStop(0, '#dde1da'); g.addColorStop(1, '#c4cac2'); }

    g = ctx.createLinearGradient(0, horizon, 0, h);
    if (night) { g.addColorStop(0, '#10161a'); g.addColorStop(1, '#090c0e'); } else { g.addColorStop(0, '#bfc5bb'); g.addColorStop(1, '#c9cdc5'); }
    ctx.fillStyle = g; ctx.fillRect(0, horizon, w, h - horizon);
    if (night) {
      for (const s of stars) { ctx.globalAlpha = .35 + .5 * Math.abs(Math.sin(t / 1400 + s.p)); ctx.fillStyle = '#e8eefc'; ctx.fillRect(s.x, s.y, s.r, s.r); }
      ctx.globalAlpha = 1;
      const mx = w * .84, my = Math.min(80, horizon * .35);
      const halo = ctx.createRadialGradient(mx, my, 10, mx, my, 110); halo.addColorStop(0, 'rgba(230,236,255,.35)'); halo.addColorStop(1, 'rgba(230,236,255,0)');
      ctx.fillStyle = halo; ctx.beginPath(); ctx.arc(mx, my, 110, 0, 7); ctx.fill();
      ctx.fillStyle = '#eef0f6'; ctx.beginPath(); ctx.arc(mx, my, 24, 0, 7); ctx.fill();
      ctx.fillStyle = 'rgba(160,170,190,.35)'; ctx.beginPath(); ctx.arc(mx - 7, my - 4, 5, 0, 7); ctx.arc(mx + 8, my + 7, 3.5, 0, 7); ctx.fill();
    } else {
      const sx = w * .18, sy = Math.min(70, horizon * .3);
      const sun = ctx.createRadialGradient(sx, sy, 4, sx, sy, 120); sun.addColorStop(0, 'rgba(255,253,240,.9)'); sun.addColorStop(.25, 'rgba(255,250,230,.35)'); sun.addColorStop(1, 'rgba(255,250,230,0)');
      ctx.fillStyle = sun; ctx.beginPath(); ctx.arc(sx, sy, 120, 0, 7); ctx.fill();

    ctx.beginPath(); ctx.moveTo(0, horizon + 2); hills.forEach((y, i) => ctx.lineTo(i * 40, y)); ctx.lineTo(w, horizon + 2); ctx.closePath(); ctx.fill();

    }

})();

/* ================= 纸钱雨（圆形方孔） ================= */
const Joss = (() => {
  const cv = $('#joss'), ctx = cv.getContext('2d'); let parts = [], raf = 0;
  function size() { const d = Math.min(2, devicePixelRatio || 1); cv.width = innerWidth * d; cv.height = innerHeight * d; ctx.setTransform(d, 0, 0, d, 0, 0); }
  function burst(n = 70) {
    if (REDUCED) return; size();
    for (let i = 0; i < n; i++) parts.push({x: Math.random() * innerWidth, y: -20 - Math.random() * innerHeight * .6, vy: 1.8 + Math.random() * 1.8, sw: Math.random() * 6, r: 8 + Math.random() * 7, rot: Math.random() * 6, vr: (Math.random() - .5) * .08, flip: Math.random() * 6});
    if (!raf) raf = requestAnimationFrame(loop);
  }
  function loop(t) {
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    parts = parts.filter(p => p.y < innerHeight + 30);
    for (const p of parts) {
      p.y += p.vy; p.x += Math.sin(t / 600 + p.sw) * .8; p.rot += p.vr;
      const sx = Math.abs(Math.cos(t / 400 + p.flip));
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.scale(Math.max(.15, sx), 1);
      ctx.fillStyle = '#e2c27a'; ctx.strokeStyle = 'rgba(140,100,30,.6)'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(0, 0, p.r, 0, 7); ctx.rect(p.r * .32, -p.r * .32, -p.r * .64, p.r * .64); ctx.fill('evenodd'); ctx.stroke();
      ctx.restore();
    }
    if (parts.length) raf = requestAnimationFrame(loop); else { raf = 0; ctx.clearRect(0, 0, innerWidth, innerHeight); }
  }
  addEventListener('resize', () => { if (raf) size(); });
  return {burst};
})();

}
const itemsText = items => Object.entries(items || {}).filter(([k, n]) => ITEM[k] && n > 0).map(([k, n]) => `${ITEM[k].name}×${n}`).join('、') || '一点心意';
const ghostOut = () => !!S.myTomb && (isNightAt(new Date()) || Date.now() < (S.myTomb.zhashiUntil || 0));
const zhashiActive = () => !!S.myTomb && !isNightAt(new Date()) && Date.now() < (S.myTomb.zhashiUntil || 0);
const canBurn = t => t.npc || (!!S.store && !!S.uid && S.canWrite !== false);
function layoutPlots() {
  const map = new Map(), placed = new Map();
  NPCS.forEach(n => { map.set(n.plot, n); placed.set(n.id, n.plot); });
  const tombs = [...S.tombs].sort((a, b) => (a.diedAt || 0) - (b.diedAt || 0));
  for (const t of tombs) {
    let p = Number.isInteger(t.plot) && t.plot >= 0 && t.plot < 2000 ? t.plot : 0;
    while (map.has(p)) p++;
    map.set(p, t); placed.set(t.id, p);
  }
  const used = Math.max(-1, ...map.keys());
  const total = Math.max(30, Math.ceil((Math.max(used + 1, map.size + 6)) / COLS) * COLS + (used + 1 > 24 ? COLS : 0));
  return {map, placed, total};
}

function toast(html, {btn, onBtn, err, ms = 4200} = {}) {

  if (btn) el.querySelector('button').onclick = () => { el.remove(); onBtn && onBtn(); };
  $('#toasts').append(el);
  setTimeout(() => el.remove(), btn ? ms + 3000 : ms);
}
let modalEl = null;
function openModal(html, mount) {

  modalEl.innerHTML = `<div class="modal" role="dialog" aria-modal="true"><button class="x" data-close aria-label="关闭">✕</button>${html}</div>`;
  modalEl.addEventListener('click', e => { if (e.target === modalEl || e.target.closest('[data-close]')) closeModal(); });
  document.body.append(modalEl);
  mount && mount(modalEl.querySelector('.modal'));
  const f = modalEl.querySelector('textarea, input'); if (f) setTimeout(() => f.focus(), 30);
}
function closeModal() { if (modalEl) { modalEl.remove(); modalEl = null; } }
async function copyText(text, okMsg) {

  const own = t.id === S.uid;
  openModal(`<h2>${own ? '给自己烧点' : '给' + esc(t.name) + '烧纸'}</h2>
    <p class="sub">${own ? '自力更生，丰衣足食。' : `${esc(t.name)}之墓 · ${esc(t.cause || '')}。挑点东西，写句话，点火就送到。`}</p>

    <div class="mfoot"><span class="why" id="bsum" style="margin-right:auto">还没挑东西</span><button class="btn primary" id="fire" disabled>点火</button></div>`, m => {
    const sum = () => {
      const n = Object.values(cart).reduce((a, b) => a + b, 0);

      w.querySelector('.cnt')?.remove(); w.querySelector('.minus')?.remove();

/* ================= 化纸动画 ================= */
function burnAnimation(items, t) {
  return new Promise(resolve => {
    const ov = document.createElement('div'); ov.className = 'burn';
    ov.innerHTML = `<canvas></canvas><div class="basin"></div><div class="burn-msg">正在化纸……</div><div class="burn-sub">给 ${esc(t.name)} · ${esc(itemsText(items))}</div>`;
    document.body.append(ov);
    const cv = ov.querySelector('canvas'), ctx = cv.getContext('2d');
    const dpr = Math.min(2, devicePixelRatio || 1); cv.width = innerWidth * dpr; cv.height = innerHeight * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const cx = innerWidth / 2, cy = innerHeight * .64;
    let heat = .25, parts = [], done = false, raf = 0;
    const loop = () => {
      ctx.clearRect(0, 0, innerWidth, innerHeight);
      const n = Math.round(6 * heat + 1);
      for (let i = 0; i < n; i++) parts.push({x: cx + (Math.random() - .5) * 170 * Math.min(1, heat + .3), y: cy + 4, vx: (Math.random() - .5) * .8, vy: -(1.4 + Math.random() * 2.6 * heat), life: 0, max: 30 + Math.random() * 40, r: 8 + Math.random() * 14 * heat, ember: Math.random() < .08});
      ctx.globalCompositeOperation = 'lighter';
      parts = parts.filter(p => p.life < p.max);
      for (const p of parts) {
        p.life++; p.x += p.vx + Math.sin((p.life + p.y) / 9) * .4; p.y += p.ember ? p.vy * 1.6 : p.vy;
        const k = p.life / p.max;
        if (p.ember) { ctx.fillStyle = `rgba(255,${200 - k * 120},80,${1 - k})`; ctx.fillRect(p.x, p.y, 2, 2); continue; }
        const r = p.r * (1 - k * .6), g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, r);
        g.addColorStop(0, `rgba(255,${230 - k * 150},${120 - k * 100},${.55 * (1 - k)})`); g.addColorStop(1, 'rgba(255,60,0,0)');
        ctx.fillStyle = g; ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, 7); ctx.fill();
      }
      ctx.globalCompositeOperation = 'source-over';
      if (!done) raf = requestAnimationFrame(loop);
    };
    raf = requestAnimationFrame(loop);
    Sound.crackle(3.6);
    const icons = []; Object.entries(items).forEach(([k, n]) => { for (let i = 0; i < Math.min(n, 3); i++) icons.push(ITEM[k]?.icon || '💴'); });
    icons.splice(14);
    icons.forEach((ic, i) => {
      const el = document.createElement('span'); el.className = 'fall'; el.textContent = ic;
      const sx = cx + (Math.random() - .5) * Math.min(innerWidth * .8, 600);
      el.style.left = (sx - 19) + 'px'; el.style.top = '-60px'; ov.append(el);
      const dy = cy + 60, dx = cx - sx + (Math.random() - .5) * 60;
      const a = el.animate([{transform: 'translate(0,0) rotate(0) scale(1)', opacity: 1}, {transform: `translate(${dx * .9}px,${dy * .8}px) rotate(${(Math.random() - .5) * 220}deg) scale(.95)`, opacity: 1, offset: .75}, {transform: `translate(${dx}px,${dy}px) rotate(${(Math.random() - .5) * 400}deg) scale(.2)`, opacity: 0}], {duration: REDUCED ? 10 : 1400, delay: REDUCED ? 0 : 200 + i * 170, easing: 'cubic-bezier(.45,0,.75,.6)', fill: 'forwards'});
      a.onfinish = () => { heat = Math.min(1.25, heat + .14); el.remove(); };
    });
    const total = REDUCED ? 900 : Math.max(3400, 200 + icons.length * 170 + 1800);
    const finish = () => {
      if (done) return; done = true; cancelAnimationFrame(raf);
      ov.style.transition = 'opacity .5s'; ov.style.opacity = '0'; setTimeout(() => { ov.remove(); resolve(); }, 500);
    };
    setTimeout(() => { ov.querySelector('.burn-msg').textContent = '已送达 · 阴间到账'; Joss.burst(40); }, total - 900);
    setTimeout(finish, total + 600);
    setTimeout(() => ov.addEventListener('click', finish), 1500);
  });
}

  let bootedView = false;
  S.store.watchTombs((list, meta) => {
    S.tombs = list;
    if (!meta.fromCache) { loaded = true; clearTimeout(timer); S.ready = true; S.netNote = ''; }
    if (!bootedView && S.ready) { bootedView = true; }
    onDataChanged();
    if (S.pendingHash || location.hash.startsWith('#tomb-') || location.hash === '#funeral') handleHash();
  }, err => { clearTimeout(timer); S.netNote = err.code === 'revoked' ? '' : '墓园数据读取失败，刷新试试'; S.ready = true; renderHeader(); });
  S.store.watchBurns((list) => onBurns(list), () => {});
  initRoom();
}
boot();
})();
</script>
